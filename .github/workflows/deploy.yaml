name: Deploy to Cloudflare Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ['main']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

# Allow one concurrent deployment
concurrency:
  group: 'cloudflare-pages'
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: lts/*
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Check Cloudflare token
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "Token length: ${#TOKEN}"
          if [[ "$TOKEN" == "Bearer "* ]]; then
            echo "ERROR: Token incorrectly starts with 'Bearer '"
            exit 1
          fi
          if [[ "$TOKEN" == \"* || "$TOKEN" == *\" ]]; then
            echo "ERROR: Token appears to contain quotes"
            exit 1
          fi
      # - name: Verify Cloudflare token
      #   env:
      #     CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      #   run: |
      #     curl --fail-with-body \
      #       "https://api.cloudflare.com/client/v4/user/tokens/verify" \
      #       -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
      - name: Verify Cloudflare token 2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl --fail-with-body \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/tokens/verify" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=natmal
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}